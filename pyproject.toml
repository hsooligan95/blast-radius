[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius"
version = "0.1.0"
description = "BlastRadius — an infrastructure remediation agent with a blast radius of zero: plan, approve, checkpointed execution, verification, automatic rollback."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "boto3==1.44.9",
    "langgraph==1.2.24",
    "langgraph-checkpoint-sqlite==3.1.3",
]

[project.optional-dependencies]
demo = ["moto[server]==5.2.5"]
dev = ["moto[server]==5.2.5", "pytest==9.2.0"]

[project.scripts]
blastradius = "blastradius.cli:main"

[tool.setuptools.packages.find]
include = ["blastradius*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
